# =====================================================================
# ProSight backend settings
# This file contains NO passwords or keys, so it is safe to push to git.
# Real secrets go in secrets.properties (next to pom.xml), which git ignores.
# On Railway, the same values come from environment variables instead.
# =====================================================================

# Load secrets.properties if it exists (optional, so Railway still works without it).
# Looked for in src/main/resources first, then in the folder the app is started from.
spring.config.import=optional:classpath:secrets.properties,optional:file:./secrets.properties

# ===============================
# Database (local MySQL, or Railway's MYSQL_* variables)
# ===============================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/prosight?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# Hibernate / JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Gemini AI (AI-suggested actions for high-impact risks)
# ===============================
gemini.api.key=${GEMINI_API_KEY:}

# ===============================
# Email (Gmail)
# spring.mail.password must be a 16-letter Gmail APP password, not your normal password.
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# ===============================
# ProSight notifications
# ===============================
# Optional: an extra 9:00 overview of ALL overdue tasks sent to this address (e.g. a manager).
prosight.alerts.email=${ALERTS_EMAIL:}
# Used for links inside emails.
prosight.app-url=${APP_URL:http://localhost:5173}